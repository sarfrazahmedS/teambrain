name: Deploy demo

# Publishes the client as a static live demo (in-memory mock backend) to
# GitHub Pages at https://sarfrazahmeds.github.io/teambrain/.
on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build demo (static)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # Static build: mode "demo" turns on the mock backend (.env.demo),
      # VITE_BASE serves assets from the repo's Pages sub-path.
      - name: Build (demo mode)
        run: npm run build:demo
        env:
          VITE_BASE: /teambrain/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
