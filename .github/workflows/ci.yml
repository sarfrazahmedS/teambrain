name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server — typecheck · test · build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: teambrain
          POSTGRES_PASSWORD: teambrain
          POSTGRES_DB: teambrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teambrain -d teambrain_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://teambrain:teambrain@localhost:5432/teambrain_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
